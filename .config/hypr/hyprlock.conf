# hyprlock — see https://wiki.hyprland.org/Hypr-Ecosystem/hyprlock

$font   = JetBrainsMono Nerd Font

general {
    hide_cursor = true
}

# Everything eases in/out — nothing snaps.
animations {
    enabled = true
    bezier = easeOut, 0.16, 1, 0.3, 1
    bezier = smooth,  0.45, 0, 0.55, 1
    animation = fadeIn,           1, 8,  easeOut
    animation = fadeOut,          1, 6,  smooth
    animation = inputFieldColors, 1, 5,  smooth
    animation = inputFieldFade,   1, 5,  smooth
    animation = inputFieldWidth,  1, 4,  easeOut
    animation = inputFieldDots,   1, 3,  easeOut
}

background {
    monitor =
    # symlink to the current wallpaper, refreshed by scripts/lock.sh
    path = ~/.cache/hyprlock-bg
    blur_passes = 2
    blur_size = 5
    brightness = 0.65
    vibrancy = 0.2
}

# TIME
label {
    monitor =
    text = $TIME
    font_size = 110
    font_family = $font Light
    color = rgba(ffffffbb)
    position = 0, 190
    halign = center
    valign = center
}

# DATE — e.g. Wednesday, 23 September 2026
label {
    monitor =
    text = cmd[update:60000] LC_TIME=en_US.UTF-8 date +"%A, %-d %B %Y"
    font_size = 22
    font_family = $font Light
    color = rgba(ffffff99)
    position = 0, 80
    halign = center
    valign = center
}

# Frosted-glass field: no outline, translucent white fill
input-field {
    monitor =
    size = 420, 64
    rounding = 18
    outline_thickness = 0
    inner_color = rgba(255, 255, 255, 0.12)
    font_color = rgba(ffffffdd)
    font_family = $font
    check_color = rgba(255, 255, 255, 0.20)
    fail_color = rgba(255, 110, 130, 0.25)
    capslock_color = rgba(255, 220, 150, 0.20)

    placeholder_text = <span foreground="##ffffff77">Password</span>
    fail_text = <span foreground="##ffffffaa"><i>$FAIL</i></span>
    fade_on_empty = false
    dots_size = 0.25
    dots_spacing = 0.35
    dots_center = true

    position = 0, -40
    halign = center
    valign = center
}

# KEYBOARD LAYOUT (click to switch)
label {
    monitor =
    text = $LAYOUT[en,ru]
    font_size = 15
    font_family = $font
    color = rgba(ffffff88)
    onclick = hyprctl switchxkblayout all next
    position = 0, -115
    halign = center
    valign = center
}
