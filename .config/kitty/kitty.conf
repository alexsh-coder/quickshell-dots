font_family JetBrainsMono Nerd Font
font_size 13.0
# Per-machine overrides (e.g. font_size 16.0 on the 4K desktop); gitignored, optional
globinclude machine.conf
window_padding_width 14

confirm_os_window_close 0

# -- Transparency toggle (Super+T) --------------------------------------
allow_remote_control yes
listen_on unix:@kitty

background            #131a20
foreground             #e0e0e0
cursor                 #33ccff
cursor_trail 1
cursor_trail_decay 0.15 0.5
cursor_trail_start_threshold 0
cursor_blink_interval 0.6 ease-in-out
selection_background   #33ccff
selection_foreground   #14161a

dynamic_background_opacity yes
background_opacity 0.82
background_blur 20

# accent-matched color palette (house blue)
color0  #1e2026
color8  #7a7f8a
color4  #33ccff
color12 #33ccff
color2  #33ccff
color10 #33ccff

# Wallpaper-derived accent (cursor/selection/ANSI slots), written by
# Quickshell's services/Accent.qml. Overrides the #33ccff defaults above.
globinclude theme-colors.conf
